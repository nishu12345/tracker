<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nishant's Tracker — Daily Habits & Career Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --surface3: #22222e;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-dim: #7a7a8e;
    --green: #34d399;
    --green-bg: rgba(52, 211, 153, 0.1);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251, 191, 36, 0.1);
    --red: #f87171;
    --red-bg: rgba(248, 113, 113, 0.1);
    --accent: #818cf8;
    --accent-bg: rgba(129, 140, 248, 0.08);
    --purple: #a78bfa;
    --blue: #60a5fa;
    --orange: #fb923c;
    --pink: #f472b6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 12px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .app-header {
    text-align: center;
    padding: 16px 0 8px;
  }

  .app-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ===== TABS ===== */
  .tab-bar {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin: 12px auto 16px;
    max-width: 320px;
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 11px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .tab-btn.active {
    background: var(--accent-bg);
    color: var(--accent);
    box-shadow: 0 2px 12px rgba(129, 140, 248, 0.15);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== MOTIVATION BANNER ===== */
  .motivation-banner {
    background: linear-gradient(135deg, rgba(129,140,248,0.08), rgba(52,211,153,0.06));
    border: 1px solid rgba(129,140,248,0.15);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .motivation-banner::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(129,140,248,0.04), transparent 50%);
    animation: shimmer 8s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { transform: translateX(-10%) translateY(-10%); }
    50% { transform: translateX(10%) translateY(10%); }
  }

  .motivation-icon { font-size: 20px; margin-bottom: 6px; display: block; }

  .motivation-text {
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  /* ===== DAILY TAB ===== */
  .daily-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 0 12px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .month-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .month-nav button:active { background: var(--border); }

  .month-label {
    font-size: 16px;
    font-weight: 700;
    min-width: 150px;
    text-align: center;
  }

  .settings-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .settings-btn:active { transform: rotate(60deg); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 0 0 14px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    text-align: center;
    min-width: 64px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .stat:active { transform: scale(0.95); }

  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .stat-tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface3);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
    color: var(--accent);
    font-weight: 600;
  }

  .stat.show-tip .stat-tooltip { opacity: 1; }

  /* Calendar */
  .weekday-headers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }

  .weekday-header {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    padding: 5px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .day-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 3px;
    min-height: 54px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .day-cell.today { border-color: var(--accent); box-shadow: 0 0 12px rgba(129, 140, 248, 0.2); }
  .day-cell.future { opacity: 0.35; }

  .day-num { font-size: 11px; font-weight: 700; text-align: center; margin-bottom: 3px; color: var(--text); }
  .day-cell.today .day-num { color: var(--accent); }

  .day-dots { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
  .dot.done { background: var(--green); }

  .mode-bar { height: 3px; border-radius: 2px; margin-top: 3px; background: transparent; }
  .mode-bar.green { background: var(--green); }
  .mode-bar.yellow { background: var(--yellow); }
  .mode-bar.red { background: var(--red); }

  /* Legend */
  .legend { display: flex; justify-content: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-dim); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Streak */
  .streak-banner { text-align: center; margin: 10px 0 0; font-size: 13px; color: var(--text-dim); }
  .streak-banner span { color: var(--green); font-weight: 700; }

  .streak-fire { display: inline-block; }
  .streak-fire.pulse { animation: firePulse 1.5s ease-in-out infinite; }
  @keyframes firePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); filter: brightness(1.3); }
  }

  /* ===== MODALS ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
    padding: 16px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
    animation: slideUp 0.3s ease;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal::-webkit-scrollbar { width: 4px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }

  .habit-list { display: flex; flex-direction: column; gap: 8px; }

  .habit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  .habit-row:active { transform: scale(0.98); }
  .habit-row.checked { background: var(--green-bg); border-color: rgba(52, 211, 153, 0.3); }

  .habit-check {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 13px;
  }

  .habit-row.checked .habit-check { background: var(--green); border-color: var(--green); }
  .habit-icon { font-size: 17px; flex-shrink: 0; }
  .habit-name { font-size: 14px; font-weight: 500; flex: 1; }

  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .modal-score { font-size: 13px; color: var(--text-dim); }
  .modal-score span { font-weight: 700; font-size: 17px; color: var(--text); }

  .modal-mode { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .modal-mode.green { background: var(--green-bg); color: var(--green); }
  .modal-mode.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .modal-mode.red { background: var(--red-bg); color: var(--red); }
  .modal-mode.none { background: var(--surface2); color: var(--text-dim); }

  .close-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }

  .close-btn:active { background: var(--border); }

  /* ===== SETTINGS MODAL ===== */
  .settings-habit {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
  }

  .settings-habit .habit-icon { font-size: 18px; }
  .settings-habit .habit-name { font-size: 14px; font-weight: 500; flex: 1; }

  .settings-remove {
    background: none;
    border: none;
    color: var(--red);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: background 0.2s;
    line-height: 1;
  }

  .settings-remove:active { background: var(--red-bg); }

  .add-habit-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .add-habit-row input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-habit-row input:focus { border-color: var(--accent); }

  .add-habit-row input.emoji-input { width: 50px; flex: none; text-align: center; font-size: 18px; }

  .add-habit-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .add-habit-btn:active { opacity: 0.8; }

  /* ===== ROADMAP TAB ===== */
  .roadmap-overview {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .progress-ring-wrap {
    position: relative;
    cursor: pointer;
    width: 72px;
    height: 72px;
  }

  .progress-ring-wrap svg { transform: rotate(-90deg); }

  .progress-ring-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 5;
  }

  .progress-ring-fill {
    fill: none;
    stroke: url(#progressGrad);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease;
  }

  .progress-ring-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
  }

  .progress-ring-label {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .xp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 100px;
  }

  .xp-card:active { transform: scale(0.95); }

  .xp-level { font-size: 11px; font-weight: 700; color: var(--purple); text-transform: uppercase; letter-spacing: 0.5px; }
  .xp-value { font-size: 20px; font-weight: 800; color: var(--text); margin: 2px 0; }
  .xp-bar-outer { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .xp-bar-inner { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 2px; transition: width 0.8s ease; }

  /* Milestones */
  .milestones {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .milestone {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    opacity: 0.3;
    filter: grayscale(1);
  }

  .milestone.earned {
    opacity: 1;
    filter: none;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(129, 140, 248, 0.2);
    animation: badgeEarn 0.5s ease;
  }

  @keyframes badgeEarn { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .milestone-tip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 10px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
    color: var(--text);
    font-weight: 500;
  }

  .milestone.show-tip .milestone-tip { opacity: 1; }

  /* Roadmap sections */
  .roadmap-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: all 0.2s;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.2s;
  }

  .section-header:active { background: var(--surface2); }

  .section-icon { font-size: 22px; flex-shrink: 0; }

  .section-info { flex: 1; min-width: 0; }
  .section-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .section-subtitle { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  .section-badge {
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .section-badge:active { transform: scale(1.3); }

  .section-progress-wrap { flex-shrink: 0; width: 50px; }
  .section-progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .section-progress-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }

  .section-pct { font-size: 10px; color: var(--text-dim); text-align: right; margin-top: 2px; }

  .section-arrow {
    font-size: 12px;
    color: var(--text-dim);
    transition: transform 0.3s;
    flex-shrink: 0;
  }

  .roadmap-section.expanded .section-arrow { transform: rotate(90deg); }

  .section-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out;
  }

  .roadmap-section.expanded .section-body {
    max-height: 5000px;
    transition: max-height 0.6s ease-in;
  }

  .group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    padding: 10px 16px 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .roadmap-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }

  .roadmap-item:active { background: var(--surface2); }

  .roadmap-check {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 11px;
    margin-top: 1px;
  }

  .roadmap-item.done .roadmap-check { background: var(--green); border-color: var(--green); }
  .roadmap-item.done .roadmap-item-text { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border); }

  .roadmap-item-text { font-size: 13px; line-height: 1.4; flex: 1; }

  .section-divider { height: 1px; background: var(--border); margin: 4px 16px; }

  /* ===== TOAST ===== */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: linear-gradient(135deg, var(--surface3), var(--surface2));
    border: 1px solid var(--green);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  .toast.xp-toast {
    border-color: var(--purple);
    color: var(--purple);
    font-size: 14px;
    font-weight: 800;
  }

  /* ===== RESPONSIVE ===== */
  @media (min-width: 500px) {
    body { padding: 20px; max-width: 600px; margin: 0 auto; }
    .day-cell { min-height: 68px; padding: 7px 5px; }
    .day-num { font-size: 12px; }
    .dot { width: 6px; height: 6px; }
    .roadmap-item-text { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- SVG gradient definition for progress ring -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
</svg>

<div class="app-header">
  <div class="app-title">NISHANT'S TRACKER</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="daily" onclick="switchTab('daily')">📅 Daily</button>
  <button class="tab-btn" data-tab="roadmap" onclick="switchTab('roadmap')">🗺️ Roadmap</button>
</div>

<!-- ===== DAILY TAB ===== -->
<div id="dailyView" class="tab-content active">

// ===== HELPERS =====
function storageKey(y, m, d) { return `t_${y}_${m}_${d}`; }
function getData(y, m, d) { const r = localStorage.getItem(storageKey(y, m, d)); return r ? JSON.parse(r) : {}; }
function setData(y, m, d, data) { localStorage.setItem(storageKey(y, m, d), JSON.stringify(data)); }
function isToday(y, m, d) { return now.getFullYear() === y && now.getMonth() === m && now.getDate() === d; }
function isFuture(y, m, d) { const t = new Date(); t.setHours(0,0,0,0); return new Date(y, m, d) > t; }

function getHabits() {
  const s = localStorage.getItem('tracker_habits');
  return s ? JSON.parse(s) : DEFAULT_HABITS;
}

function saveHabits(h) { localStorage.setItem('tracker_habits', JSON.stringify(h)); }

function getScore(y, m, d) {
  const data = getData(y, m, d);
  const habits = getHabits();
  return habits.filter(h => data[h.key]).length;
}

function getMode(score, total) {
  if (!total) return 'none';
  const pct = score / total;
  if (pct >= 0.67) return 'green';
  if (pct >= 0.33) return 'yellow';
  if (score >= 1) return 'red';
  return 'none';
}

function getModeLabel(score, total) {
  if (!total) return '—';
  const pct = score / total;
  if (pct >= 0.67) return '🟢 Full';
  if (pct >= 0.33) return '🟡 Minimum';
  if (score >= 1) return '🔴 Emergency';
  return '—';
}

// ===== ROADMAP DATA HELPERS =====
function getRoadmapData(sectionId) {
  const r = localStorage.getItem(`rm_${sectionId}`);
  return r ? JSON.parse(r) : {};
}

function setRoadmapData(sectionId, data) {
  localStorage.setItem(`rm_${sectionId}`, JSON.stringify(data));
}

function getRoadmapStats() {
  let total = 0, grandTotal = 0;
  const sections = {}, sectionTotals = {};
  ROADMAP.forEach(sec => {
    let secDone = 0, secTotal = 0;
    const data = getRoadmapData(sec.id);
    sec.groups.forEach((g, gi) => {
      g.items.forEach((_, ii) => {
        secTotal++;
        if (data[`${gi}_${ii}`]) secDone++;
      });
    });
    sections[sec.id] = secDone;
    sectionTotals[sec.id] = secTotal;
    total += secDone;
    grandTotal += secTotal;
  });
  return { total, grandTotal, sections, sectionTotals };
}

function getSectionBadge(done, total) {
  if (!total) return '🥉';
  const pct = done / total;
  if (pct >= 1) return '💎';
  if (pct >= 0.67) return '🥇';
  if (pct >= 0.33) return '🥈';
  return '🥉';
}

function getSectionGradient(done, total) {
  if (!total) return 'var(--border)';
  const pct = done / total;
  if (pct >= 1) return 'linear-gradient(90deg, #818cf8, #34d399)';
  if (pct >= 0.67) return 'linear-gradient(90deg, #fbbf24, #34d399)';
  if (pct >= 0.33) return 'linear-gradient(90deg, #818cf8, #a78bfa)';
  return 'var(--accent)';
}

function getXpInfo(totalDone) {
  const xp = totalDone * 10;
  let lvl = XP_LEVELS[0];
  for (const l of XP_LEVELS) {
    if (xp >= l.min) lvl = l;
  }
  const pct = lvl.max === Infinity ? 100 : ((xp - lvl.min) / (lvl.max - lvl.min)) * 100;
  return { xp, level: lvl.level, name: lvl.name, pct: Math.min(100, pct) };
}

// ===== MOTIVATION =====
function getDailyMotivation() {
  const d = new Date();
  const idx = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % MOTIVATIONS.length;
  return MOTIVATIONS[idx];
}

function renderMotivation() {
  const m = getDailyMotivation();
  const html = `<span class="motivation-icon">${m.icon}</span><span class="motivation-text">${m.text}</span>`;
  document.getElementById('dailyMotivation').innerHTML = html;
  document.getElementById('roadmapMotivation').innerHTML = html;
}

// ===== TOAST =====
function showToast(message, isXp = false) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast' + (isXp ? ' xp-toast' : '');
  t.textContent = message;
  c.appendChild(t);
  requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

function randomPraise(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ===== TAB SWITCHING =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(tab === 'daily' ? 'dailyView' : 'roadmapView').classList.add('active');
  if (tab === 'roadmap') renderRoadmap();
}

// ===== DAILY TRACKER RENDERING =====
function renderDaily() {
  renderMonth();
  renderStats();
  renderStreak();
}

function renderMonth() {
  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('monthLabel');
  label.textContent = `${MONTHS[currentMonth]} ${currentYear}`;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const startOffset = (firstDay === 0) ? 6 : firstDay - 1;
  const habits = getHabits();
  const total = habits.length;

  let html = '';
  for (let i = 0; i < startOffset; i++) html += '<div class="day-cell empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const today = isToday(currentYear, currentMonth, d);
    const future = isFuture(currentYear, currentMonth, d);
    const score = getScore(currentYear, currentMonth, d);
    const mode = getMode(score, total);
    const data = getData(currentYear, currentMonth, d);

    let cls = 'day-cell';
    if (today) cls += ' today';
    if (future) cls += ' future';

    let dots = habits.map(h => `<div class="dot${data[h.key] ? ' done' : ''}"></div>`).join('');
    const modeBar = score > 0 ? `<div class="mode-bar ${mode}"></div>` : '<div class="mode-bar"></div>';

    html += `<div class="${cls}" onclick="openDay(${d})">
      <div class="day-num">${d}</div>
      <div class="day-dots">${dots}</div>
      ${modeBar}
    </div>`;
  }
  grid.innerHTML = html;
}

function renderStats() {
  const bar = document.getElementById('statsBar');
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const habits = getHabits();
  const total = habits.length;
  let greenDays = 0, yellowDays = 0, redDays = 0, activeDays = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    if (isFuture(currentYear, currentMonth, d)) continue;
    const score = getScore(currentYear, currentMonth, d);
    if (score > 0) {
      activeDays++;
      const mode = getMode(score, total);
      if (mode === 'green') greenDays++;
      else if (mode === 'yellow') yellowDays++;
      else if (mode === 'red') redDays++;
    }
  }

  const pct = activeDays > 0 ? Math.round((greenDays / activeDays) * 100) : 0;

  bar.innerHTML = `
    <div class="stat" onclick="flashTip(this,'${greenDays} full-mode days')">
      <div class="stat-tooltip"></div>
      <div class="stat-value" style="color:var(--green)">${greenDays}</div><div class="stat-label">🟢 Days</div>
    </div>
    <div class="stat" onclick="flashTip(this,'${yellowDays} minimum-mode days')">
      <div class="stat-tooltip"></div>
      <div class="stat-value" style="color:var(--yellow)">${yellowDays}</div><div class="stat-label">🟡 Days</div>
    </div>
    <div class="stat" onclick="flashTip(this,'${redDays} low-mode days')">
      <div class="stat-tooltip"></div>
      <div class="stat-value" style="color:var(--red)">${redDays}</div><div class="stat-label">🔴 Days</div>
    </div>
    <div class="stat" onclick="flashTip(this,'${activeDays} active / ${daysInMonth} total days')">
      <div class="stat-tooltip"></div>
      <div class="stat-value">${activeDays}</div><div class="stat-label">Active</div>
    </div>
    <div class="stat" onclick="flashTip(this,'${pct}% of active days were Full mode')">
      <div class="stat-tooltip"></div>
      <div class="stat-value" style="color:var(--accent)">${pct}%</div><div class="stat-label">🎯 Rate</div>
    </div>
  `;
}

function flashTip(el, text) {
  el.querySelector('.stat-tooltip').textContent = text;
  el.classList.add('show-tip');
  setTimeout(() => el.classList.remove('show-tip'), 2000);
}

function renderStreak() {
  const banner = document.getElementById('streakBanner');
  let streak = 0;
  const check = new Date();
  check.setHours(0,0,0,0);

  while (true) {
    const s = getScore(check.getFullYear(), check.getMonth(), check.getDate());
    if (s > 0) { streak++; check.setDate(check.getDate() - 1); }
    else break;
  }

  if (streak > 0) {
    const fire = streak >= 3 ? 'pulse' : '';
    banner.innerHTML = `<span class="streak-fire ${fire}">🔥</span> Current streak: <span>${streak} day${streak > 1 ? 's' : ''}</span>`;
  } else {
    banner.innerHTML = `Start your streak today!`;
  }
}

// ===== DAY MODAL =====
function openDay(d) {
  if (isFuture(currentYear, currentMonth, d)) return;
  selectedDate = { y: currentYear, m: currentMonth, d };
  const date = new Date(currentYear, currentMonth, d);
  document.getElementById('modalDate').textContent = `${DAYS_FULL[date.getDay()]}, ${d} ${MONTHS[currentMonth]}`;

  const habits = getHabits();
  const data = getData(currentYear, currentMonth, d);
  const list = document.getElementById('habitList');

  list.innerHTML = habits.map((h, i) => {
    const checked = data[h.key] ? 'checked' : '';
    return `<div class="habit-row ${checked}" onclick="toggleHabit(${i})" id="habit_${i}">
      <div class="habit-check">${data[h.key] ? '✓' : ''}</div>
      <div class="habit-icon">${h.icon}</div>
      <div class="habit-name">${h.name}</div>
    </div>`;
  }).join('');

  updateModalFooter();
  document.getElementById('dayModal').classList.add('active');
}

function toggleHabit(i) {
  const { y, m, d } = selectedDate;
  const habits = getHabits();
  const data = getData(y, m, d);
  const key = habits[i].key;
  const wasChecked = !!data[key];
  data[key] = !data[key];
  setData(y, m, d, data);

  const row = document.getElementById(`habit_${i}`);
  row.classList.toggle('checked');
  row.querySelector('.habit-check').textContent = data[key] ? '✓' : '';

  if (!wasChecked) {
    const score = habits.filter(h => data[h.key]).length;
    if (score === habits.length) {
      showToast(randomPraise(PRAISE_ALL_DONE));
    } else {
      showToast(randomPraise(PRAISE_DAILY));
    }
  }

  updateModalFooter();
  renderDaily();
}

function updateModalFooter() {
  const { y, m, d } = selectedDate;
  const habits = getHabits();
  const score = getScore(y, m, d);
  const total = habits.length;
  document.getElementById('modalScore').textContent = `${score}/${total}`;

  const modeEl = document.getElementById('modalMode');
  const mode = getMode(score, total);
  modeEl.textContent = getModeLabel(score, total);
  modeEl.className = `modal-mode ${mode}`;
}

function closeDayModal() { document.getElementById('dayModal').classList.remove('active'); }

document.getElementById('dayModal').onclick = (e) => {
  if (e.target === e.currentTarget) closeDayModal();
};

// ===== SETTINGS MODAL =====
function openSettings() {
  renderSettingsList();
  document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('active');
  renderDaily();
}

function renderSettingsList() {
  const habits = getHabits();
  const list = document.getElementById('settingsHabitList');
  list.innerHTML = habits.map((h, i) => `
    <div class="settings-habit">
      <div class="habit-icon">${h.icon}</div>
      <div class="habit-name">${h.name}</div>
      <button class="settings-remove" onclick="removeHabit(${i})" title="Remove">✕</button>
    </div>
  `).join('');
}

function removeHabit(i) {
  const habits = getHabits();
  if (habits.length <= 1) { showToast("Need at least 1 habit!"); return; }
  habits.splice(i, 1);
  saveHabits(habits);
  renderSettingsList();
}

function addHabit() {
  const iconInput = document.getElementById('newHabitIcon');
  const nameInput = document.getElementById('newHabitName');
  const icon = iconInput.value.trim() || '🎯';
  const name = nameInput.value.trim();
  if (!name) { showToast("Enter a habit name!"); return; }

  const key = name.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_').substring(0, 30);
  const habits = getHabits();

  if (habits.some(h => h.key === key)) { showToast("Habit already exists!"); return; }

  habits.push({ key, icon, name });
  saveHabits(habits);
  iconInput.value = '';
  nameInput.value = '';
  renderSettingsList();
  showToast(`Added "${name}" ${icon}`);
}

document.getElementById('settingsModal').onclick = (e) => {
  if (e.target === e.currentTarget) closeSettings();
};

// ===== ROADMAP RENDERING =====
function renderRoadmap() {
  const stats = getRoadmapStats();
  const xp = getXpInfo(stats.total);

  // Progress ring
  const circumference = 2 * Math.PI * 30; // r=30
  const pct = stats.grandTotal > 0 ? stats.total / stats.grandTotal : 0;
  const offset = circumference * (1 - pct);
  document.getElementById('progressRingFill').style.strokeDashoffset = offset;
  document.getElementById('progressRingText').textContent = `${Math.round(pct * 100)}%`;

  // XP
  document.getElementById('xpLevel').textContent = `Level ${xp.level} — ${xp.name}`;
  document.getElementById('xpValue').textContent = `${xp.xp} XP`;
  document.getElementById('xpBar').style.width = `${xp.pct}%`;

  // Milestones
  const mEl = document.getElementById('milestones');
  mEl.innerHTML = MILESTONE_DEFS.map(m => {
    const earned = m.check(stats);
    return `<div class="milestone ${earned ? 'earned' : ''}" onclick="flashMilestoneTip(this,'${m.name}${earned ? ' ✅' : ' — Not yet'}')">
      ${m.icon}
      <div class="milestone-tip"></div>
    </div>`;
  }).join('');

  // Sections
  const container = document.getElementById('roadmapSections');
  container.innerHTML = ROADMAP.map(sec => {
    const done = stats.sections[sec.id];
    const total = stats.sectionTotals[sec.id];
    const pctSec = total > 0 ? Math.round((done / total) * 100) : 0;
    const badge = getSectionBadge(done, total);
    const grad = getSectionGradient(done, total);
    const data = getRoadmapData(sec.id);

    let groupsHtml = '';
    sec.groups.forEach((g, gi) => {
      groupsHtml += `<div class="group-title">${g.title}</div>`;
      g.items.forEach((item, ii) => {
        const key = `${gi}_${ii}`;
        const isDone = !!data[key];
        groupsHtml += `<div class="roadmap-item ${isDone ? 'done' : ''}" onclick="toggleRoadmapItem('${sec.id}',${gi},${ii},this)">
          <div class="roadmap-check">${isDone ? '✓' : ''}</div>
          <div class="roadmap-item-text">${item}</div>
        </div>`;
      });
      if (gi < sec.groups.length - 1) groupsHtml += '<div class="section-divider"></div>';
    });

    return `<div class="roadmap-section" id="section_${sec.id}">
      <div class="section-header" onclick="toggleSection('${sec.id}')">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-info">
          <div class="section-title">${sec.title}</div>
          <div class="section-subtitle">${sec.subtitle}</div>
        </div>
        <div class="section-badge" onclick="event.stopPropagation();flashSectionBadge(this,'${done}/${total} done')">${badge}</div>
        <div class="section-progress-wrap">
          <div class="section-progress-bar"><div class="section-progress-fill" style="width:${pctSec}%;background:${grad}"></div></div>
          <div class="section-pct">${pctSec}%</div>
        </div>
        <div class="section-arrow">▶</div>
      </div>
      <div class="section-body">${groupsHtml}</div>
    </div>`;
  }).join('');
}

function toggleSection(sectionId) {
  document.getElementById(`section_${sectionId}`).classList.toggle('expanded');
}

function toggleRoadmapItem(sectionId, gi, ii, el) {
  const data = getRoadmapData(sectionId);
  const key = `${gi}_${ii}`;
  const wasDone = !!data[key];
  data[key] = !data[key];
  setRoadmapData(sectionId, data);

  el.classList.toggle('done');
  el.querySelector('.roadmap-check').textContent = data[key] ? '✓' : '';

  if (!wasDone) {
    showToast(randomPraise(PRAISE_ROADMAP));
    setTimeout(() => showToast('+10 XP', true), 400);
  }

  // Re-render stats (but preserve section expand state)
  const expandedSections = [];
  ROADMAP.forEach(s => {
    if (document.getElementById(`section_${s.id}`)?.classList.contains('expanded')) {
      expandedSections.push(s.id);
    }
  });

  renderRoadmap();

  // Restore expand state
  expandedSections.forEach(id => {
    document.getElementById(`section_${id}`)?.classList.add('expanded');
  });
}

function flashSectionBadge(el, text) {
  // Find the parent section-header, then find the badge within it
  const tip = el;
  tip.style.transform = 'scale(1.3)';
  setTimeout(() => tip.style.transform = '', 200);
  showToast(text);
}

function flashRingDetail() {
  const stats = getRoadmapStats();
  showToast(`${stats.total} / ${stats.grandTotal} items completed`);
}

function flashXpDetail() {
  const stats = getRoadmapStats();
  const xp = getXpInfo(stats.total);
  const nextLvl = XP_LEVELS.find(l => l.min > xp.xp);
  const msg = nextLvl ? `${xp.xp} XP — ${nextLvl.min - xp.xp} XP to Level ${nextLvl.level}` : `${xp.xp} XP — MAX LEVEL! 🏆`;
  showToast(msg);
}

function flashMilestoneTip(el, text) {
  el.querySelector('.milestone-tip').textContent = text;
  el.classList.add('show-tip');
  setTimeout(() => el.classList.remove('show-tip'), 2000);
}

// ===== MONTH NAVIGATION =====
document.getElementById('prevMonth').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderDaily();
};

document.getElementById('nextMonth').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderDaily();
};

// ===== INIT =====
renderMotivation();
renderDaily();

</script>
</body>
