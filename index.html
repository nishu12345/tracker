<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nishant's Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-dim: #7a7a8e;
    --green: #34d399;
    --green-bg: rgba(52, 211, 153, 0.1);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251, 191, 36, 0.1);
    --red: #f87171;
    --red-bg: rgba(248, 113, 113, 0.1);
    --accent: #818cf8;
    --accent-bg: rgba(129, 140, 248, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .header {
    text-align: center;
    padding: 20px 0 24px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
  }

  .month-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .month-nav button:active { background: var(--border); }

  .month-label {
    font-size: 17px;
    font-weight: 600;
    min-width: 160px;
    text-align: center;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 16px 0 20px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 70px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* Calendar grid */
  .weekday-headers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }

  .weekday-header {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    padding: 6px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .day-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 4px;
    min-height: 58px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .day-cell.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
  }

  .day-cell.today {
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(129, 140, 248, 0.2);
  }

  .day-cell.future {
    opacity: 0.35;
  }

  .day-num {
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
    color: var(--text);
  }

  .day-cell.today .day-num {
    color: var(--accent);
  }

  .day-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    justify-content: center;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }

  .dot.done { background: var(--green); }

  /* Mode indicator */
  .mode-bar {
    height: 3px;
    border-radius: 2px;
    margin-top: 4px;
    background: transparent;
  }

  .mode-bar.green { background: var(--green); }
  .mode-bar.yellow { background: var(--yellow); }
  .mode-bar.red { background: var(--red); }

  /* Day detail modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
    padding: 16px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-date {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }

  .habit-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .habit-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  .habit-row:active {
    transform: scale(0.98);
  }

  .habit-row.checked {
    background: var(--green-bg);
    border-color: rgba(52, 211, 153, 0.3);
  }

  .habit-check {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 14px;
  }

  .habit-row.checked .habit-check {
    background: var(--green);
    border-color: var(--green);
  }

  .habit-icon { font-size: 18px; flex-shrink: 0; }

  .habit-name {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
  }

  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .modal-score {
    font-size: 14px;
    color: var(--text-dim);
  }

  .modal-score span {
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
  }

  .modal-mode {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .modal-mode.green { background: var(--green-bg); color: var(--green); }
  .modal-mode.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .modal-mode.red { background: var(--red-bg); color: var(--red); }
  .modal-mode.none { background: var(--surface2); color: var(--text-dim); }

  .close-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }

  .close-btn:active { background: var(--border); }

  /* Legend */
  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Streak banner */
  .streak-banner {
    text-align: center;
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  .streak-banner span {
    color: var(--green);
    font-weight: 700;
  }

  @media (min-width: 500px) {
    .day-cell { min-height: 70px; padding: 8px 6px; }
    .day-num { font-size: 13px; }
    .dot { width: 7px; height: 7px; }
    body { padding: 24px; max-width: 600px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>DAILY TRACKER</h1>
  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonth">›</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="weekday-headers">
  <div class="weekday-header">Mon</div>
  <div class="weekday-header">Tue</div>
  <div class="weekday-header">Wed</div>
  <div class="weekday-header">Thu</div>
  <div class="weekday-header">Fri</div>
  <div class="weekday-header">Sat</div>
  <div class="weekday-header">Sun</div>
</div>

<div class="calendar-grid" id="calendarGrid"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Done</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div> Missed</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--green);width:16px;height:4px;border-radius:2px"></div> 🟢 4+</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--yellow);width:16px;height:4px;border-radius:2px"></div> 🟡 2-3</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--red);width:16px;height:4px;border-radius:2px"></div> 🔴 1</div>
</div>

<div class="streak-banner" id="streakBanner"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-date" id="modalDate"></div>
    <div class="habit-list" id="habitList"></div>
    <div class="modal-footer">
      <div class="modal-score">Score: <span id="modalScore">0/6</span></div>
      <div class="modal-mode" id="modalMode"></div>
    </div>
    <button class="close-btn" id="closeModal">Done</button>
  </div>
</div>

<script>
const WEEKDAY_HABITS = [
  { key: 'study',    icon: '📖', name: 'Study' },
  { key: 'gym',      icon: '🏋️', name: 'Gym' },
  { key: 'am_skin',  icon: '🧴', name: 'AM Skincare' },
  { key: 'pm_skin',  icon: '🌙', name: 'PM Skincare' },
  { key: 'meal1',    icon: '🍽️', name: 'Meal 1' },
  { key: 'meal2',    icon: '🍽️', name: 'Meal 2' },
];

const WEEKEND_HABITS = [
  { key: 'study',    icon: '📖', name: 'Study' },
  { key: 'movement', icon: '🚶', name: 'Movement' },
  { key: 'am_skin',  icon: '🧴', name: 'AM Skincare' },
  { key: 'pm_skin',  icon: '🌙', name: 'PM Skincare' },
  { key: 'meal1',    icon: '🍽️', name: 'Meal 1' },
  { key: 'meal2',    icon: '🍽️', name: 'Meal 2' },
];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let currentYear = 2026;
let currentMonth = 4; // May (0-indexed)
let selectedDate = null;

// --- Data ---
function storageKey(y, m, d) { return `t_${y}_${m}_${d}`; }

function getData(y, m, d) {
  const raw = localStorage.getItem(storageKey(y, m, d));
  return raw ? JSON.parse(raw) : {};
}

function setData(y, m, d, data) {
  localStorage.setItem(storageKey(y, m, d), JSON.stringify(data));
}

function isWeekend(y, m, d) {
  const dow = new Date(y, m, d).getDay();
  return dow === 0 || dow === 6;
}

function getHabits(y, m, d) {
  return isWeekend(y, m, d) ? WEEKEND_HABITS : WEEKDAY_HABITS;
}

function getScore(y, m, d) {
  const data = getData(y, m, d);
  const habits = getHabits(y, m, d);
  return habits.filter(h => data[h.key]).length;
}

function getMode(score) {
  if (score >= 4) return 'green';
  if (score >= 2) return 'yellow';
  if (score >= 1) return 'red';
  return 'none';
}

function getModeLabel(score) {
  if (score >= 4) return '🟢 Full';
  if (score >= 2) return '🟡 Minimum';
  if (score >= 1) return '🔴 Emergency';
  return '—';
}

function isToday(y, m, d) {
  const now = new Date();
  return now.getFullYear() === y && now.getMonth() === m && now.getDate() === d;
}

function isFuture(y, m, d) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const check = new Date(y, m, d);
  return check > now;
}

// Seed today's data (May 18, 2026)
(function seedToday() {
  const key = storageKey(2026, 4, 18);
  if (!localStorage.getItem(key)) {
    setData(2026, 4, 18, { study: true, gym: true, am_skin: true, pm_skin: true });
  }
})();

// --- Render ---
function render() {
  renderMonth();
  renderStats();
  renderStreak();
}

function renderMonth() {
  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('monthLabel');
  label.textContent = `${MONTHS[currentMonth]} ${currentYear}`;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  // Monday-based: convert Sunday(0) to 6, Mon(1) to 0, etc.
  const startOffset = (firstDay === 0) ? 6 : firstDay - 1;

  let html = '';

  // Empty cells
  for (let i = 0; i < startOffset; i++) {
    html += '<div class="day-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const today = isToday(currentYear, currentMonth, d);
    const future = isFuture(currentYear, currentMonth, d);
    const score = getScore(currentYear, currentMonth, d);
    const mode = getMode(score);
    const habits = getHabits(currentYear, currentMonth, d);
    const data = getData(currentYear, currentMonth, d);

    let classes = 'day-cell';
    if (today) classes += ' today';
    if (future) classes += ' future';

    let dots = '';
    habits.forEach(h => {
      dots += `<div class="dot${data[h.key] ? ' done' : ''}"></div>`;
    });

    const modeBar = score > 0 ? `<div class="mode-bar ${mode}"></div>` : '<div class="mode-bar"></div>';

    html += `<div class="${classes}" onclick="openDay(${d})">
      <div class="day-num">${d}</div>
      <div class="day-dots">${dots}</div>
      ${modeBar}
    </div>`;
  }

  grid.innerHTML = html;
}

function renderStats() {
  const bar = document.getElementById('statsBar');
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const now = new Date();
  let greenDays = 0, yellowDays = 0, redDays = 0, totalScore = 0, activeDays = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    if (isFuture(currentYear, currentMonth, d)) continue;
    const score = getScore(currentYear, currentMonth, d);
    if (score > 0) {
      activeDays++;
      totalScore += score;
      const mode = getMode(score);
      if (mode === 'green') greenDays++;
      else if (mode === 'yellow') yellowDays++;
      else if (mode === 'red') redDays++;
    }
  }

  bar.innerHTML = `
    <div class="stat"><div class="stat-value" style="color:var(--green)">${greenDays}</div><div class="stat-label">🟢 Days</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--yellow)">${yellowDays}</div><div class="stat-label">🟡 Days</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--red)">${redDays}</div><div class="stat-label">🔴 Days</div></div>
    <div class="stat"><div class="stat-value">${activeDays}</div><div class="stat-label">Active</div></div>
  `;
}

function renderStreak() {
  const banner = document.getElementById('streakBanner');
  let streak = 0;
  const now = new Date();
  let check = new Date(now);
  check.setHours(0,0,0,0);

  while (true) {
    const s = getScore(check.getFullYear(), check.getMonth(), check.getDate());
    if (s > 0) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else {
      break;
    }
  }

  if (streak > 0) {
    banner.innerHTML = `🔥 Current streak: <span>${streak} day${streak > 1 ? 's' : ''}</span>`;
  } else {
    banner.innerHTML = `Start your streak today!`;
  }
}

// --- Modal ---
function openDay(d) {
  if (isFuture(currentYear, currentMonth, d)) return;

  selectedDate = { y: currentYear, m: currentMonth, d };
  const date = new Date(currentYear, currentMonth, d);
  const dayName = DAYS[date.getDay()];
  const we = isWeekend(currentYear, currentMonth, d);

  document.getElementById('modalDate').textContent = `${dayName}, ${d} ${MONTHS[currentMonth]}`;

  const habits = getHabits(currentYear, currentMonth, d);
  const data = getData(currentYear, currentMonth, d);
  const list = document.getElementById('habitList');

  list.innerHTML = habits.map((h, i) => {
    const checked = data[h.key] ? 'checked' : '';
    return `<div class="habit-row ${checked}" onclick="toggleHabit(${i})" id="habit_${i}">
      <div class="habit-check">${data[h.key] ? '✓' : ''}</div>
      <div class="habit-icon">${h.icon}</div>
      <div class="habit-name">${h.name}</div>
    </div>`;
  }).join('');

  updateModalFooter();
  document.getElementById('modalOverlay').classList.add('active');
}

function toggleHabit(i) {
  const { y, m, d } = selectedDate;
  const habits = getHabits(y, m, d);
  const data = getData(y, m, d);
  const key = habits[i].key;
  data[key] = !data[key];
  setData(y, m, d, data);

  const row = document.getElementById(`habit_${i}`);
  row.classList.toggle('checked');
  row.querySelector('.habit-check').textContent = data[key] ? '✓' : '';

  updateModalFooter();
  render();
}

function updateModalFooter() {
  const { y, m, d } = selectedDate;
  const score = getScore(y, m, d);
  document.getElementById('modalScore').textContent = `${score}/6`;

  const modeEl = document.getElementById('modalMode');
  const mode = getMode(score);
  modeEl.textContent = getModeLabel(score);
  modeEl.className = `modal-mode ${mode}`;
}

document.getElementById('closeModal').onclick = () => {
  document.getElementById('modalOverlay').classList.remove('active');
};

document.getElementById('modalOverlay').onclick = (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('modalOverlay').classList.remove('active');
  }
};

document.getElementById('prevMonth').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById('nextMonth').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

// Initial render
render();
</script>
</body>
</html>
